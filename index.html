<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Parking Bay KLB - Operasional Lapangan TIP A & B</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Aplikasi Mobile Operasional Lapangan & Keamanan Parking Bay Tol KLB (Jalur A & Jalur B). Offline-Capable, Geofencing, Patroli QR & Defect Tracking." />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Parking Bay KLB" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/screens.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <!-- Device Frame (Simulasi Smartphone pada Layar Desktop) -->
  <div class="device-frame">
    <div id="app-root">
      <!-- App dynamically injected via js/app.js -->
    </div>
  </div>

  <!-- Desktop Outer Footer -->
  <footer style="margin: 14px 0 24px; text-align: center; font-size: 12px; color: #64748b; font-family: 'Plus Jakarta Sans', sans-serif;">
    PT Waskita Bumi Wira (Tol KLB) • <span style="color: #38bdf8; font-weight: 700;">Develop by Hendra Bhakti</span>
  </footer>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- PWA Service Worker Registration & Main Script -->
  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
          .catch((err) => console.warn('PWA Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
